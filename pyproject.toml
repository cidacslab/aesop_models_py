[build-system]
requires = ["hatchling"]          # uv usa hatchling por padrão
build-backend = "hatchling.build"


[project]
name = "aesop-models-py"
version = "0.1.0"
# description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numba>=0.65.0",
    "pandas>=3.0.1",
    "polars>=1.39.2",
    "pyarrow>=23.0.1",
    "statsmodels>=0.14.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aesop"]

[dependency-groups]
docs = [
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.1.0",
]
